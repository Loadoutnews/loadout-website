name: Update News
on:
  workflow_dispatch:         # manuell startbar über den "Run workflow"-Button

# Dieselbe Concurrency-Gruppe wie breaking-news-check.yml und
# rumor-tracker.yml — siehe dort für die Begründung. Betrifft hier
# insbesondere den direkten Push-Schritt weiter unten (der PR-Schritt
# selbst schreibt auf einen eigenen Branch, nicht auf main, ist von dieser
# Race-Bedingung also nicht betroffen).
concurrency:
  group: loadout-main-writer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python news_pipeline.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # WICHTIG: pending-resolutions.json wird bewusst SOFORT direkt
      # committet und gepusht — OHNE den Pull Request unten, OHNE manuelle
      # Prüfung. Der Inhalt hier ist kein veröffentlichter Artikel, sondern
      # nur ein internes Übergabesignal an den Leaks & Gerüchte-Tracker
      # (siehe rumor_tracker.py: process_pending_resolutions), der ohnehin
      # bereits komplett ohne manuelle Prüfung läuft. Würde diese Datei
      # stattdessen im PR unten landen, müsste das Schliessen des
      # betroffenen Trackers bis zum manuellen Mergen warten — je nach
      # Review-Tempo potenziell tagelang, statt binnen weniger Stunden
      # (nächster Gerüchte-Tracker-Lauf).
      #
      # Läuft VOR "python build_pages.py" und VOR dem PR-Schritt, damit die
      # Datei zum Zeitpunkt des PR-Schritts bereits committet/"sauber" ist
      # und dadurch automatisch NICHT Teil des PR-Diffs wird.
      - name: Gerüchte-Tracker-Übergabe sofort committen (kein PR nötig)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # Existiert nur, wenn news_pipeline.py tatsächlich etwas
          # weitergereicht hat (Normalfall: Datei existiert nicht) — ein
          # "git add" mit festem Dateinamen auf eine fehlende Datei würde
          # sonst den ganzen Schritt mit einem Pathspec-Fehler abbrechen.
          if [ -f pending-resolutions.json ]; then git add pending-resolutions.json; fi

          if git diff --staged --quiet; then
            echo "Keine Übergabe an den Gerüchte-Tracker in diesem Lauf."
            exit 0
          fi
          git commit -m "Update-Übergabe an Gerüchte-Tracker"

          # Retry mit Rebase, falls main sich zwischen Checkout und Push
          # bereits weiterbewegt hat (z. B. durch breaking-news-check.yml
          # oder rumor-tracker.yml) — siehe dieselbe Logik dort für Details.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Push erfolgreich (Versuch $attempt)."
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Push nach 5 Versuchen weiterhin fehlgeschlagen." >&2
              exit 1
            fi
            echo "Push fehlgeschlagen — hole aktuellen Stand und versuche erneut (Versuch $attempt)..."
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 6 + 2))
          done

      - run: python build_pages.py
      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Automatisches News-Update"
          title: "🆕 Neue Artikel zur Prüfung"
          body: "Von der Pipeline automatisch generiert. Bitte vor dem Mergen kurz gegenlesen (Fakten, Ton, Kategorisierung)."
          branch: "auto-news-update"