name: Leaks & Rumor Tracker
on:
  workflow_dispatch:
  # Ausgelöst über cron-job.org (alle 3-4 Stunden empfohlen — Gerüchte
  # brauchen nicht die stündliche Taktung von Breaking News, aber deutlich
  # häufiger als der 19-Uhr-Hauptlauf) — genau wie die anderen Pipelines,
  # siehe README/Setup-Hinweise.

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Auf neue/laufende Gerüchte prüfen und Tracker aktualisieren
        run: python rumor_tracker.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Gerüchte-Tracker-Seiten bauen
        run: python build_rumor_pages.py

      # WICHTIG: post_to_social.py wird HIER, im selben Workflow-Lauf,
      # direkt aufgerufen — nicht über den separaten "Post to Social
      # Media"-Workflow (siehe breaking-news-check.yml: ein automatischer
      # git push mit dem Standard-GITHUB_TOKEN löst laut GitHub bewusst
      # KEINEN anderen Workflow aus). Läuft mit --rumors, damit NUR die
      # beiden Gerüchte-Ereignisse (neuer Tracker / abgeschlossen) geprüft
      # werden, nicht der normale articles.json-Pfad. Postet nur wirklich
      # etwas, wenn rumor_tracker.py auch tatsächlich einen neuen Tracker
      # eröffnet oder einen bestehenden abgeschlossen hat — sonst findet
      # post_to_social.py --rumors einfach nichts Neues und beendet sich
      # sofort ohne etwas zu tun.
      - name: Social-Media-Post auslösen (falls ein Gerüchte-Ereignis entstanden ist)
        run: python post_to_social.py --rumors
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ secrets.BUFFER_INSTAGRAM_CHANNEL_ID }}
          PUSH_SECRET: ${{ secrets.PUSH_SECRET }}
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_OAUTH_TOKEN: ${{ secrets.TUMBLR_OAUTH_TOKEN }}
          TUMBLR_OAUTH_TOKEN_SECRET: ${{ secrets.TUMBLR_OAUTH_TOKEN_SECRET }}
          TUMBLR_BLOG_NAME: ${{ secrets.TUMBLR_BLOG_NAME }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_REDDIT_ACCOUNT_ID: ${{ secrets.ZERNIO_REDDIT_ACCOUNT_ID }}
          REDDIT_SUBREDDIT: ${{ secrets.REDDIT_SUBREDDIT }}

      - name: Restliche Änderungen committen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add rumors.json rumor-checked.json rumor-state.json rumor-social-posted.json geruechte.html geruechte/ sitemap.xml pending-resolutions.json
          git diff --staged --quiet || git commit -m "Gerüchte-Tracker-Prüfung"
          git push