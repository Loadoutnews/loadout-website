name: Breaking News Check
on:
  workflow_dispatch:
  # Ausgelöst über cron-job.org (stündlich empfohlen) — genau wie die
  # anderen Pipelines, siehe README/Setup-Hinweise.

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python breaking_news_check.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add articles.json archive.json breaking-checked.json breaking-state.json
          git diff --staged --quiet || git commit -m "Breaking-News-Prüfung"
          git push